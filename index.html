
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>HACKING</title>
    <style>
      :root {
        --green: #39ff14;
        --green-soft: #b9ffab;
        --black: #000000;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; min-height: 100%; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: var(--green);
        font-family: "Courier New", Courier, monospace;
      }

      #matrix {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: .52;
        background: radial-gradient(circle at center, rgba(0, 60, 10, .2), transparent 58%);
        mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
      }

      .column {
        position: absolute;
        top: -35vh;
        color: var(--green);
        font-size: clamp(14px, 1.65vw, 24px);
        line-height: 1.05;
        text-shadow: 0 0 8px var(--green);
        white-space: pre;
        animation: fall linear infinite;
      }

      @keyframes fall {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: .8; }
        86% { opacity: .38; }
        100% { transform: translateY(150vh); opacity: 0; }
      }

      .screen {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at center, transparent 0 24%, rgba(0,0,0,.36) 72%, rgba(0,0,0,.85));
      }

      .content {
        width: min(900px, 100%);
        text-align: center;
      }

      .top-line {
        margin-bottom: 30px;
        color: rgba(185, 255, 171, .58);
        font-size: 11px;
        letter-spacing: .35em;
        text-transform: uppercase;
      }

      .top-line::before,
      .top-line::after {
        display: inline-block;
        width: clamp(25px, 9vw, 100px);
        height: 1px;
        margin: 0 14px 4px;
        content: "";
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }

      h1 {
        margin: 0;
        color: var(--green);
        font-size: clamp(48px, 13vw, 150px);
        font-weight: 400;
        letter-spacing: .16em;
        line-height: .95;
        text-indent: .16em;
        text-shadow: 0 0 8px var(--green), 0 0 26px rgba(57,255,20,.8), 0 0 70px rgba(57,255,20,.35);
      }


      .loading {
        width: min(390px, 76vw);
        height: 8px;
        margin: 30px auto 0;
        padding: 2px;
        overflow: hidden;
        border: 1px solid rgba(57, 255, 20, .55);
        background: rgba(0, 20, 3, .72);
        box-shadow: 0 0 10px rgba(57, 255, 20, .2), inset 0 0 5px rgba(57, 255, 20, .15);
      }

      .loading-bar {
        width: 42%;
        height: 100%;
        background: var(--green);
        box-shadow: 0 0 8px var(--green), 0 0 18px rgba(57, 255, 20, .8);
        animation: loading-scan 2s ease-in-out infinite;
      }

      @keyframes loading-scan {
        0% { transform: translateX(-125%); }
        100% { transform: translateX(365%); }
      }

      .subline {
        margin-top: 28px;
        color: var(--green-soft);
        font-size: 12px;
        letter-spacing: .22em;
        text-transform: uppercase;
        opacity: .72;
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        margin-left: 8px;
        vertical-align: -2px;
        background: var(--green);
        box-shadow: 0 0 9px var(--green);
        animation: blink .8s steps(2) infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      .bottom-line {
        position: fixed;
        right: 24px;
        bottom: 20px;
        left: 24px;
        display: flex;
        justify-content: space-between;
        color: rgba(185, 255, 171, .38);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .bottom-line span:last-child { color: rgba(57, 255, 20, .72); }

      @media (max-width: 600px) {
        .top-line { letter-spacing: .15em; }
        .top-line::before, .top-line::after { margin: 0 6px 4px; }
        .subline { font-size: 10px; letter-spacing: .12em; }
        .bottom-line { right: 14px; bottom: 14px; left: 14px; font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <div id="matrix" aria-hidden="true"></div>

    <main class="screen">
      <section class="content">
        <div class="top-line">SYSTEM ACCESS</div>
        <h1>HACKING</h1>
        <div class="loading" aria-label="Loading"><div class="loading-bar"></div></div>
        <div class="subline">accessing system<span class="cursor"></span></div>
      </section>
    </main>

    <div class="bottom-line">
      <span>system: online</span>
      <span>connection: encrypted</span>
    </div>

    <script>
      const matrix = document.getElementById("matrix");
      const numbers = "0123456789";

      for (let i = 0; i < 78; i++) {
        const column = document.createElement("span");
        const length = 8 + Math.floor(Math.random() * 18);
        column.className = "column";
        column.textContent = Array.from({ length }, () => numbers[Math.floor(Math.random() * numbers.length)]).join("\n");
        column.style.left = `${Math.random() * 100}%`;
        column.style.animationDuration = `${5 + Math.random() * 9}s`;
        column.style.animationDelay = `${-Math.random() * 12}s`;
        column.style.opacity = `${.2 + Math.random() * .65}`;
        matrix.appendChild(column);
      }
    </script>
  </body>
</html>
